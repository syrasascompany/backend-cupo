spring:
  application:
    name: agenda-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}

  jpa:
    hibernate:
      ddl-auto: validate      # el esquema lo manda Flyway, nunca Hibernate
    open-in-view: false
    # OJO: no poner aquí hibernate.jdbc.time_zone.
    # Las marcas de tiempo ya se guardan como Instant, que no tiene ese
    # problema, pero esa opción corrompe los campos de solo hora del
    # horario base: lee las 08:00 como UTC y las corre cinco horas.

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:credigestorapp@gmail.com}
    password: ${SMTP_PASS:dvpk yyej anns rfdv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # En producción va por variable de entorno. Mínimo 32 caracteres.
    secreto: ${JWT_SECRETO:cambie-esta-clave-por-una-larga-y-secreta-de-verdad}
    horas: 12
  correo:
    desde: ${CORREO_DESDE:credigestorapp@gmail.com}
  # Se usa para armar el enlace de "olvidé mi contraseña"
  url-panel: ${URL_PANEL:http://localhost:4200}
  whatsapp:
    version: v21.0
    # true = no se llama a Meta; los mensajes se guardan para poder
    # probar el bot sin número real. Póngalo en false para producción.
    simular: ${WA_SIMULAR:false}
    # El mismo valor que se escribe en Meta al configurar el webhook
    verify-token: ${WA_VERIFY_TOKEN:cupo-verifica-2026}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
